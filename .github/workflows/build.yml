name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # Ubuntu 24.04 has the Cairo used for the published exports; other versions can change PNG bytes.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Cairo and the pinned dependencies
        run: |
          dpkg -s libcairo2 >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y libcairo2; }
          pip install -r requirements.txt
      - run: python scripts/build.py
      - name: Check the committed assets match the build
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::Committed assets differ from scripts/build.py. Rebuild and commit the result."
            exit 1
          fi
      - run: python scripts/package.py
