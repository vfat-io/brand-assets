name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check the tag matches the kit version
        run: grep -qx "VERSION = \"$GITHUB_REF_NAME\"" scripts/build.py
      - name: Install Cairo and the pinned dependencies
        run: |
          dpkg -s libcairo2 >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y libcairo2; }
          pip install -r requirements.txt
      - name: Check the committed assets match the build
        run: |
          python scripts/build.py
          test -z "$(git status --porcelain)"
      - run: python scripts/package.py
      # A draft, so a maintainer writes the notes before publishing.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/vfat-brand-assets.zip dist/SHA256SUMS.txt
          --draft --verify-tag --generate-notes --title "VFAT brand assets ${GITHUB_REF_NAME#v}"
